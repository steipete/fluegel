name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the event commit
        # This public repository needs no checkout action or stored credentials.
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run the full local gate
        run: scripts/check.sh

      - name: Smoke-test both CLI architectures
        run: |
          arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true
          arch -arm64 dist/fluegel --version
          arch -x86_64 dist/fluegel --version
